name: Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - port/**
      - web/**
      - arks/**
      - cmd/**

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build index
        run: |
          go run . render --kind index > ./web/index.json
          echo "::notice::$(jq '.ports | length' ./web/index.json) ports, $(stat -c %s ./web/index.json) bytes"

      - name: Stamp build
        run: |
          date="$(git log -1 --format=%cs)"
          sha="$(git rev-parse --short HEAD)"
          for f in ./web/index.html ./web/port.html; do
            sed -i "s|<html lang=\"en\">|<html lang=\"en\" data-date=\"${date}\" data-sha=\"${sha}\">|" "$f"
            grep -q 'data-sha' "$f"
          done

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./web

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
