<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>arrakis &mdash; port index</title>
		<meta name="description" content="Search the ports registered in arrakis and get a ready-to-run download command." />
		<link rel="stylesheet" href="./style.css" />
	</head>
	<body>
		<header>
			<h1>arrakis</h1>
			<p class="tagline">The artifacts must flow.</p>
			<p class="scheme">
				<code>https://pkg.opt.td/<b>&lt;port&gt;</b>@<b>&lt;version&gt;</b>/<b>&lt;os&gt;</b>/<b>&lt;arch&gt;</b></code>
				redirects to the upstream release asset.
			</p>
		</header>

		<main>
			<div class="search">
				<input
					id="q"
					type="search"
					placeholder="Search ports&hellip;"
					autocomplete="off"
					autocapitalize="off"
					spellcheck="false"
					autofocus
				/>
				<p class="stat" id="stat" aria-live="polite"></p>
			</div>

			<div class="picker">
				<div class="row">
					<label id="os-label">os</label>
					<span id="os" role="group" aria-labelledby="os-label"></span>
				</div>
				<div class="row">
					<label id="arch-label">arch</label>
					<span id="arch" role="group" aria-labelledby="arch-label"></span>
				</div>

				<!--
					The command for whichever row is focused, or hovered when nothing is
					focused. It lives here rather than inside a row so that pointing at a
					different port rewrites one line instead of moving the page.
				-->
				<div class="cmd" id="cmd">
					<code id="cmd-text"></code>
					<button type="button" id="cmd-copy">copy</button>
				</div>
			</div>

			<ul id="results" class="results"></ul>
			<p id="empty" class="empty" hidden>No port matches that query.</p>
		</main>

		<footer>
			<a id="commit" class="commit" hidden></a>
			<a href="./index.json">index.json</a>
			<span id="built" class="built" hidden></span>
		</footer>

		<script type="module" src="./app.js"></script>
	</body>
</html>
